name: Publish verified binaries
on:
  workflow_dispatch:
    inputs:
      stage_ref:
        description: Owned temporary binary staging branch
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate staging reference
        env:
          STAGE_REF: ${{ inputs.stage_ref }}
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'codex/stage-[0-9]+\.[0-9]+\.[0-9]+',os.environ['STAGE_REF'])
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.stage_ref }}
          path: staging
          persist-credentials: false
      - name: Verify offline signatures and publish exact binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv staging/payload payload
          python3 verify-release.py
          python3 - <<'PY'
          import json,subprocess,pathlib,os,hashlib
          repo=os.environ['GITHUB_REPOSITORY'];r=json.loads(pathlib.Path('verified-release.json').read_text());tag=r['tag']
          gh=lambda *a:subprocess.run(['gh',*a],check=True)
          releases=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases']))
          release=next(x for x in releases if x['tag_name']==tag)
          def same(assets,name):
            p=pathlib.Path('payload')/name;a=next((x for x in assets if x['name']==name),{})
            return a.get('state')=='uploaded'and a.get('size')==p.stat().st_size and a.get('digest')=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          missing=[n for n in r['files']if not same(release['assets'],n)]
          if missing:gh('release','upload',tag,'--repo',repo,'--clobber',*[str(pathlib.Path('payload')/n)for n in missing])
          releases=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases']))
          release=next(x for x in releases if x['tag_name']==tag)
          for name in r['files']:
            asset=next(x for x in release['assets']if x['name']==name);p=pathlib.Path('payload')/name
            assert asset['state']=='uploaded'and asset['size']==p.stat().st_size and asset['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          if release['draft']:gh('release','edit',tag,'--repo',repo,'--draft=false','--prerelease')
          channel=next(x for x in releases if x['tag_name']=='beta')
          updates=[n for n in ['update-darwin-arm64.json','update-darwin-arm64.sig']if not same(channel['assets'],n)]
          if updates:gh('release','upload','beta','--repo',repo,'--clobber',*[str(pathlib.Path('payload')/n)for n in updates])
          PY
